# Pages CMS configuration for thethrivegathering.com
# Saving commits to GitHub; Netlify rebuilds the page (about 1 minute).
# Formatting in text boxes: **bold**, *italic*, [link text](https://...), and Enter for a new line.

settings:
  commit:
    identity: user

media:
  input: public/assets
  output: /assets
  rename: safe
  extensions: [jpg, jpeg, png, webp]

content:
  # ---------------------------------------------------------------
  - name: top
    label: "1. Top of page"
    type: file
    path: content/top.json
    format: json
    fields:
      - name: label
        label: First line
        type: string
        description: "Bold line under the Thrive logo, left of the divider."
      - name: speakerName
        label: Speaker name
        type: string
        description: "Shows after 'Featuring' in the italic serif."
      - name: dateText
        label: Dates
        type: string
        description: "Example: February 5 & 6, 2027"
      - name: placeText
        label: City
        description: Shows after the dates in the line under the logo, for example Omaha, NE.
        type: string
      - name: secondButton
        label: Second button text
        type: string
        description: "Outline button that jumps to the speaker section. The orange ticket button uses the link and price in section 8."

  # ---------------------------------------------------------------
  - name: theme
    label: "2. Theme (Awe and Delight)"
    type: file
    path: content/theme.json
    format: json
    fields:
      - name: eyebrow
        label: Small label above the heading
        description: The small all-caps line above the Awe and Delight heading.
        type: string
      - name: headingFirst
        label: Heading, first word
        description: The big word before the script word in the theme heading.
        type: string
      - name: headingScript
        label: Heading, script word
        type: string
        description: "Small word in the Mina script font between the two big words. Keep it lowercase."
      - name: headingLast
        label: Heading, last word
        description: The big word after the script word in the theme heading.
        type: string
      - name: lede
        label: Intro paragraph
        description: The paragraph under the theme heading. Use **bold**, *italic* or [link text](https://...).
        type: text
      - name: words
        label: Hebrew words
        description: The Hebrew word cards under the theme intro, in order.
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name} ({meaning})"
        fields:
          - name: hebrew
            label: Hebrew
            description: The large Hebrew letters at the top of the card.
            type: string
          - name: name
            label: Transliteration
            description: How the word sounds, shown under the Hebrew letters.
            type: string
          - name: meaning
            label: Meaning
            description: The English meaning, shown in bold on the card.
            type: string
          - name: text
            label: Description
            description: The short paragraph at the bottom of the card.
            type: text
      - name: verse
        label: Verse
        type: text
        description: "Quote marks are added for you. Leave blank to hide the verse."
      - name: verseRef
        label: Verse reference
        description: Shown under the verse, for example Psalm 46:10.
        type: string

  # ---------------------------------------------------------------
  - name: speaker
    label: "3. Speaker"
    type: file
    path: content/speaker.json
    format: json
    fields:
      - name: photo
        label: Photo
        type: image
        description: "Upload under 2 MB. A tall (portrait) photo works best. Large files are shrunk automatically after saving."
      - name: photoAlt
        label: Photo description
        type: string
        description: "One sentence describing the photo, for screen readers and Google."
      - name: photoTag
        label: Tag on photo
        type: string
        description: "Small label on the photo. Leave blank to hide."
      - name: eyebrow
        label: Small label above the name
        description: The small all-caps line above the speaker's name.
        type: string
      - name: name
        label: Name
        type: string
        description: "Also used in Google's event listing as the performer."
      - name: bio
        label: Bio paragraphs
        description: Paragraphs next to the speaker photo. One paragraph per item.
        type: text
        list: true
      - name: quote
        label: Quote
        type: text
        description: "Quote marks are added for you. Leave blank to hide."
      - name: highlights
        label: Highlights
        type: string
        list: true
        description: "Short tags under the bio, like '17 books'."
      - name: linkText
        label: Link text
        description: The text of the arrow link under the bio, for example Visit her website.
        type: string
      - name: linkUrl
        label: Link URL
        description: Where that arrow link goes. Paste the full https:// address.
        type: string

  # ---------------------------------------------------------------
  - name: details
    label: "4. Details and schedule"
    type: file
    path: content/details.json
    format: json
    fields:
      - name: eyebrow
        label: Small label above the heading
        description: The small all-caps line above the details heading.
        type: string
      - name: heading
        label: Heading
        description: The big heading at the top of the details and schedule section.
        type: string
      - name: cards
        label: Info cards (When, Where, Cost, Who)
        description: The four info cards under the heading, in order.
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{label}: {title}"
        fields:
          - name: label
            label: Small label
            description: The small all-caps word at the top of the card, like WHEN.
            type: string
          - name: title
            label: Big line
            description: The large line on the card.
            type: string
          - name: text
            label: Details
            description: The smaller text under the large line.
            type: text
      - name: days
        label: Schedule
        description: The schedule, one item per day.
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{label}"
        fields:
          - name: label
            label: Day
            type: string
            description: "Example: Friday · Feb 5"
          - name: items
            label: Schedule items
            description: The times and activities for this day, in order.
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{time}  {text}"
            fields:
              - name: time
                label: Time
                type: string
                description: "A time like 7:00 PM, or a word like After or Break."
              - name: text
                label: What's happening
                description: What happens at that time, shown next to it.
                type: string

  # ---------------------------------------------------------------
  - name: parking
    label: "5. Parking"
    type: file
    path: content/parking.json
    format: json
    fields:
      - name: eyebrow
        label: Small label above the heading
        description: The small all-caps line above the parking heading.
        type: string
      - name: heading
        label: Heading
        description: The big heading in the parking section.
        type: string
      - name: text
        label: Paragraph
        description: The paragraph next to the parking map.
        type: text
      - name: address
        label: Address
        description: Shown under the paragraph. Press Enter for a new line.
        type: text
      - name: directionsUrl
        label: Directions link
        type: string
        description: "The parking map itself is artwork and can't be edited here. Ask Eric for map changes."

  # ---------------------------------------------------------------
  - name: scholarships
    label: "6. Scholarships"
    type: file
    path: content/scholarships.json
    format: json
    fields:
      - name: eyebrow
        label: Small label above the heading
        description: The small all-caps line above the scholarships heading.
        type: string
      - name: heading
        label: Heading
        description: The big heading in the scholarships section.
        type: string
      - name: text
        label: Paragraph
        description: The paragraph under the scholarships heading. Use [link text](https://...) for links.
        type: text
      - name: buttonText
        label: Button text
        type: string
        description: "The button goes to the ticket link in section 8."

  # ---------------------------------------------------------------
  - name: faq
    label: "7. FAQ"
    type: file
    path: content/faq.json
    format: json
    fields:
      - name: eyebrow
        label: Small label above the heading
        description: The small all-caps line above the FAQ heading.
        type: string
      - name: heading
        label: Heading
        description: The big heading above the questions.
        type: string
      - name: items
        label: Questions
        description: The questions, in the order they appear. Drag to reorder.
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{question}"
        fields:
          - name: question
            label: Question
            description: The line people click to open the answer.
            type: string
          - name: answer
            label: Answer
            description: Shown when the question is opened. Use **bold** or [link text](https://...).
            type: text

  # ---------------------------------------------------------------
  - name: settings
    label: "8. Tickets, dates and Google"
    type: file
    path: content/settings.json
    format: json
    fields:
      - name: ticketUrl
        label: Ticket link
        type: string
        description: "Every Get Tickets and Register button on the page uses this link."
      - name: price
        label: Ticket price
        type: string
        description: "Number only, like 80. Shows on the top ticket button and in Google's listing. The Cost card and FAQ answers are written by hand, so update those too."
      - name: startDate
        label: Start date
        description: First day of the conference. Used for Google's event listing.
        type: date
        options:
          format: yyyy-MM-dd
      - name: startTime
        label: Start time
        type: string
        description: "Format like 7:00 PM. Central time. Used for Google's event listing only."
        pattern:
          regex: "^\\d{1,2}:\\d{2} ?[AaPp][Mm]$"
          message: "Use a format like 7:00 PM"
      - name: endDate
        label: End date
        description: Last day of the conference. Used for Google's event listing.
        type: date
        options:
          format: yyyy-MM-dd
      - name: endTime
        label: End time
        description: When the last session ends, like 4:00 PM. Used for Google's event listing.
        type: string
        pattern:
          regex: "^\\d{1,2}:\\d{2} ?[AaPp][Mm]$"
          message: "Use a format like 12:30 PM"
      - name: eventName
        label: Event name (Google)
        description: The event name Google shows in search results. Not shown on the page.
        type: string
      - name: eventDescription
        label: Event description (Google)
        description: One or two sentences Google shows with the event. Not shown on the page.
        type: text
      - name: seoTitle
        label: Browser tab and Google title
        description: The title in the browser tab and in Google results.
        type: string
      - name: seoDescription
        label: Google description
        type: text
        description: "The gray text under the title in search results. About 150 to 160 characters."
      - name: shareTitle
        label: Share title
        type: string
        description: "Title shown when the link is shared in a text or on social."
      - name: shareDescription
        label: Share description
        description: The text that appears when the link is shared in a text, email or social post.
        type: text
      - name: shareImage
        label: Share image
        type: image
        description: "1200 x 630 JPG. Shows when the link is shared."

  # ---------------------------------------------------------------
  - name: footer
    label: "9. Footer"
    type: file
    path: content/footer.json
    format: json
    fields:
      - name: blurb
        label: Blurb under the logo
        description: The short paragraph under the Thrive logo at the bottom of the page.
        type: text
      - name: location
        label: Location
        description: The address in the footer. Press Enter for a new line.
        type: text
      - name: contactName
        label: Contact name
        description: The contact name in the footer.
        type: string
      - name: contactEmail
        label: Contact email
        description: The email address in the footer. It becomes a clickable link.
        type: string
      - name: contactPhone
        label: Contact phone
        type: string
        description: "Format like 402.330.3360"
      - name: instagram
        label: Instagram handle
        type: string
        description: "Without the @"
      - name: fineprint
        label: Fine print
        description: The small line at the very bottom of the page.
        type: string
